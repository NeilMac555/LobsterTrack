<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mutant Academy: Survivors</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  /* the canvas is a low-res framebuffer; JS sizes and centres it on whole device pixels */
  #game {
    position: absolute; display: block; touch-action: none; outline: none;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Mutant Academy: Survivors game screen"></canvas>
<script src="game.js"></script>
</body>
</html>
