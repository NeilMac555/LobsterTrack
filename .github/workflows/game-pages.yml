# Publishes the Mutant Academy: Survivors game (the game/ folder, a static site) to GitHub Pages.
# One-time setup in the repository settings: Pages -> Build and deployment -> Source: "GitHub Actions".
# The github-pages environment only deploys from the branches it allows (the default branch to begin with).
name: Deploy game to GitHub Pages

on:
  push:
    branches: [main, claude/vampire-survivors-xmen-game-a9ctkm]
    paths: ['game/**', '.github/workflows/game-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: game-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game
      - id: deployment
        uses: actions/deploy-pages@v4
